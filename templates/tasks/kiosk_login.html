{% extends "tasks/base.html" %}
{% block title %}自助终端登录{% endblock %}
{% block header %}自助终端登录{% endblock %}
{% block content %}
<div
  id="hardware-status-panel"
  hx-get="{% url 'tasks:hardware_status_panel' %}"
  hx-trigger="load, hardware-status from:body"
  hx-target="this"
  hx-swap="innerHTML"
>
  {% include "tasks/includes/hardware_status_panel.html" %}
</div>
<div class="card">
  <div class="card-header">刷卡登录</div>
  <div class="card-body">
    <form method="post" class="vstack gap-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">刷卡登录</button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  (function () {
    var source = new EventSource("{% url 'tasks:hardware_status_stream' %}");
    var dispatch = function (event) {
      try {
        var detail = JSON.parse(event.data || "{}");
        document.body.dispatchEvent(new CustomEvent("hardware-status", { detail: detail }));
      } catch (err) {
        document.body.dispatchEvent(new CustomEvent("hardware-status", { detail: { raw: event.data } }));
      }
    };
    source.addEventListener("hardware-status", dispatch);
    window.addEventListener("beforeunload", function () {
      source.close();
    });
  })();
</script>
{% endblock %}
