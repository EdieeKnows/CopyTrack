{% extends "tasks/base.html" %}
{% block title %}加急申请{% endblock %}
{% block header %}加急申请{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">任务 {{ task.task_code }} 加急</div>
  <div class="card-body">
    <form method="post" class="vstack gap-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">提交</button>
    </form>
  </div>
</div>
{% endblock %}
