<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}CopyTrack{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/98.css@0.1.20/dist/98.css"
      integrity="sha384-evw8sxmnx8UEZ6Cs+pmzxG0MFxhLccbfprfxPQGekJv2kw6CoJKt5HkHZgKBDaVD"
      crossorigin="anonymous"
    />
    <style>
      :root {
        color-scheme: only light;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #008080, #3a6ea5);
        font-family: "MS Sans Serif", "Segoe UI", sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px;
        color: #000;
      }

      a {
        color: inherit;
      }

      .app-shell {
        width: min(1100px, 100%);
      }

      .app-window {
        width: 100%;
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.25);
      }

      .app-window .window-body {
        background-color: #c3c7cb;
        padding: 16px;
      }

      .app-title {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 24px;
      }

      .messages {
        margin-bottom: 16px;
      }

      .message-box {
        margin-bottom: 8px;
        padding: 8px 12px;
        border: 2px solid #000;
        border-left-color: #fff;
        border-top-color: #fff;
        border-right-color: #808080;
        border-bottom-color: #808080;
        background-color: #fff;
      }

      .message-box.info {
        background-color: #fff;
      }

      .message-box.success {
        background-color: #dff0d8;
      }

      .message-box.warning {
        background-color: #fff3cd;
      }

      .message-box.error,
      .message-box.danger {
        background-color: #f8d7da;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .content-area {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .content-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .content-window {
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
      }

      .content-window .window-body {
        padding: 12px 16px 16px;
        background-color: #dfe4ea;
      }

      .action-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .action-buttons .button {
        text-decoration: none;
      }

      .form-98 {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .form-98 p {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-98 label {
        font-weight: bold;
      }

      .form-98 input,
      .form-98 select,
      .form-98 textarea {
        font-family: inherit;
        font-size: 14px;
        padding: 4px;
        border: 2px solid #808080;
        border-top-color: #fff;
        border-left-color: #fff;
        background-color: #fff;
        box-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #dfdfdf;
      }

      .form-98 .helptext {
        font-size: 12px;
        color: #333;
      }

      .form-98 .errorlist {
        margin: 0;
        padding-left: 16px;
        color: #c43e3e;
        font-weight: bold;
      }

      .table-98 {
        width: 100%;
        border-collapse: collapse;
      }

      .table-98 th,
      .table-98 td {
        padding: 6px;
        border: 1px solid #000;
        background-color: #fff;
      }

      .table-98 thead th {
        background-color: #b5bec7;
      }

      .tag-urgent {
        display: inline-block;
        padding: 2px 6px;
        background-color: #c43e3e;
        color: #fff;
        border: 1px solid #000;
      }

      ul.tree-view {
        margin: 0;
      }

      .list-plain {
        margin: 0;
        padding-left: 16px;
      }

      .list-plain li + li {
        margin-top: 4px;
      }

      .stacked-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .window-body .field-row {
        align-items: center;
      }

      @media (max-width: 768px) {
        body {
          padding: 16px;
        }

        .app-window {
          min-width: auto;
        }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="app-shell">
      <div class="window app-window" role="application">
        <div class="title-bar">
          <div class="title-bar-text">CopyTrack 复印叫号系统</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          {% if messages %}
          <div class="messages">
            {% for message in messages %}
            <div class="message-box {{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
          </div>
          {% endif %}
          <h1 class="app-title">{% block header %}CopyTrack 复印叫号系统{% endblock %}</h1>
          <div class="content-area">
            {% block content %}{% endblock %}
          </div>
        </div>
        <div class="status-bar">
          <p class="status-bar-field">当前路径: {{ request.path }}</p>
          <p class="status-bar-field">Windows 98 样式界面</p>
        </div>
      </div>
    </div>
  </body>
</html>
