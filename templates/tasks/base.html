<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}CopyTrack{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
    />
  </head>
  <body>
    <section class="section">
      <div class="container">
        <h1 class="title">CopyTrack 复印叫号系统</h1>
        <p class="subtitle">{{ request.path }}</p>
        {% if messages %}
        <div>
          {% for message in messages %}
          <div class="notification is-{{ message.tags }}">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </section>
  </body>
</html>
